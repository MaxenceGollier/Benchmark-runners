name: Run MadNLP Benchmark

# Manual only, deliberately (this lives in the paper repo, not
# Penelopt.jl's own CI, and isn't meant to run on every push/PR).
on:
  workflow_dispatch:

jobs:
  Benchmark-MadNLP-Exact-Hessian:
    strategy:
      fail-fast: false
      matrix:
        split: [1, 2]

    runs-on: windows-latest

    env:
      CUTEST_SPLIT: ${{ matrix.split }}

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - name: Use Julia cache
        uses: julia-actions/cache@v2

      - name: Instantiate project
        run: |
          julia --project=code/benchmarks/MadNLP -e '
            using Pkg
            Pkg.instantiate()
          '

      - name: Run MadNLP exact-Hessian benchmark
        run: |
          julia --project=code/benchmarks/MadNLP -e '
            include("code/benchmarks/MadNLP/benchmark-cutest-madnlp-exact-hessian.jl")
          '

      - name: Upload MadNLP exact-Hessian benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cutest-madnlp-benchmark-stats-exact-hessian-${{ matrix.split }}
          path: code/benchmarks/MadNLP/result
          if-no-files-found: error
